# Render Blueprint for Mandate (https://render.com/docs/blueprint-spec).
# Secrets use `sync: false`, so Render prompts for them in the Dashboard and
# they never live in git. Review the cost preview before applying.
services:
  - type: web
    name: mandate-api
    runtime: go
    region: oregon
    plan: 0.5c-512mb # paid instance: free instances spin down after 15 min idle, which breaks webhooks
    branch: main
    buildCommand: go build -trimpath -o bin/mandated ./cmd/mandated && go build -trimpath -o bin/mandatectl ./cmd/mandatectl
    preDeployCommand: ./bin/mandatectl migrate
    startCommand: ./bin/mandated
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandate-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: MANDATE_SIGNING_SEED
        sync: false
      - key: MANDATE_KEY_ID
        value: mandate-k1
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL_ORCHESTRATOR
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_SUPPLIER
        value: openai/gpt-oss-20b
      # Studio AI panel chain (internal/api/ai.go): Claude, then Gemini,
      # NVIDIA and Groq as fallbacks. Each provider is optional.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: STUDIO_AI_NVIDIA_MODELS
        value: stepfun-ai/step-5-preview,nvidia/nemotron-3-super-120b-a12b,z-ai/glm-5.3-flash
      - key: CHANNEL3_API_KEY
        sync: false
      - key: SUPPLIER_A_SEED
        sync: false
      - key: SUPPLIER_B_SEED
        sync: false
      - key: SANDBOX_SUPPLIER_A_EMAIL
        sync: false
      - key: SANDBOX_SUPPLIER_B_EMAIL
        sync: false
      # The console's URL (the mandate-console static site below), allowed by
      # CORS. Set it after the first sync, when Render has assigned the URL.
      - key: CONSOLE_URL
        sync: false

  # Operator console (web/console): Vite + React + AG Studio, served from
  # Render's CDN. VITE_API_BASE is compiled in, so it is set inline in the
  # build command; pnpm is pinned to the version that wrote the lockfile.
  - type: web
    name: mandate-console
    runtime: static
    branch: main
    rootDir: web/console
    buildCommand: npx --yes pnpm@10.33.0 install --frozen-lockfile && VITE_API_BASE=https://mandate-api-1f5y.onrender.com npx --yes pnpm@10.33.0 run build
    staticPublishPath: ./dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

databases:
  - name: mandate-db
    region: oregon
    plan: 0.1c-256mb # smallest paid plan; free databases are time-limited
    databaseName: mandate
    user: mandate
